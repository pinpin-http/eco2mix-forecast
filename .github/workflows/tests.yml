name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Installer Python 3.12 et les dépendances épinglées
        run: |
          uv python install 3.12
          uv sync --frozen
      - name: Tests
        run: uv run pytest
